<ellipse class="case" cx="360" cy="150" rx="155" ry="38"/>
<text x="360" y="137" text-anchor="middle" font-size="12" font-weight="700">Conta, perfil e</text>
<text x="360" y="152" text-anchor="middle" font-size="12" font-weight="700">recuperação de acesso</text>
<text x="360" y="172" text-anchor="middle" font-size="11">UC-01</text>
<ellipse class="case" cx="800" cy="150" rx="155" ry="38"/>
<text x="800" y="137" text-anchor="middle" font-size="12" font-weight="700">Conferir e gerir</text>
<text x="800" y="152" text-anchor="middle" font-size="12" font-weight="700">credencial profissional</text>
<text x="800" y="172" text-anchor="middle" font-size="11">UC-02</text>
<ellipse class="case" cx="360" cy="255" rx="155" ry="38"/>
<text x="360" y="242" text-anchor="middle" font-size="12" font-weight="700">Descobrir e</text>
<text x="360" y="257" text-anchor="middle" font-size="12" font-weight="700">solicitar vínculo</text>
<text x="360" y="277" text-anchor="middle" font-size="11">UC-03.1</text>
<ellipse class="case" cx="800" cy="255" rx="155" ry="38"/>
<text x="800" y="242" text-anchor="middle" font-size="12" font-weight="700">Decidir solicitação</text>
<text x="800" y="257" text-anchor="middle" font-size="12" font-weight="700">e gerir carteira</text>
<text x="800" y="277" text-anchor="middle" font-size="11">UC-03.2</text>
<ellipse class="case" cx="360" cy="360" rx="155" ry="38"/>
<text x="360" y="347" text-anchor="middle" font-size="12" font-weight="700">Assinar e</text>
<text x="360" y="362" text-anchor="middle" font-size="12" font-weight="700">conciliar pagamento</text>
<text x="360" y="382" text-anchor="middle" font-size="11">UC-04.1</text>
<ellipse class="case" cx="800" cy="360" rx="155" ry="38"/>
<text x="800" y="347" text-anchor="middle" font-size="12" font-weight="700">Prescrever e</text>
<text x="800" y="362" text-anchor="middle" font-size="12" font-weight="700">publicar treino</text>
<text x="800" y="382" text-anchor="middle" font-size="11">UC-05.1</text>
<ellipse class="case" cx="360" cy="465" rx="155" ry="38"/>
<text x="360" y="452" text-anchor="middle" font-size="12" font-weight="700">Executar treino</text>
<text x="360" y="467" text-anchor="middle" font-size="12" font-weight="700">e enviar performance</text>
<text x="360" y="487" text-anchor="middle" font-size="11">UC-05.2</text>
<ellipse class="case" cx="800" cy="465" rx="155" ry="38"/>
<text x="800" y="452" text-anchor="middle" font-size="12" font-weight="700">Consultar retorno</text>
<text x="800" y="467" text-anchor="middle" font-size="12" font-weight="700">e corrigir mídia</text>
<text x="800" y="487" text-anchor="middle" font-size="11">UC-05.3</text>
<ellipse class="case" cx="360" cy="570" rx="155" ry="38"/>
<text x="360" y="557" text-anchor="middle" font-size="12" font-weight="700">Mensagens</text>
<text x="360" y="572" text-anchor="middle" font-size="12" font-weight="700">e notificações</text>
<text x="360" y="592" text-anchor="middle" font-size="11">UC-06</text>
<ellipse class="case" cx="360" cy="675" rx="155" ry="38"/>
<text x="360" y="662" text-anchor="middle" font-size="12" font-weight="700">Avaliar e</text>
<text x="360" y="677" text-anchor="middle" font-size="12" font-weight="700">denunciar conteúdo</text>
<text x="360" y="697" text-anchor="middle" font-size="11">UC-07.1</text>
<ellipse class="case" cx="800" cy="570" rx="155" ry="38"/>
<text x="800" y="557" text-anchor="middle" font-size="12" font-weight="700">Responder</text>
<text x="800" y="572" text-anchor="middle" font-size="12" font-weight="700">avaliação</text>
<text x="800" y="592" text-anchor="middle" font-size="11">UC-07.2</text>
<ellipse class="case" cx="800" cy="675" rx="155" ry="38"/>
<text x="800" y="662" text-anchor="middle" font-size="12" font-weight="700">Moderar</text>
<text x="800" y="677" text-anchor="middle" font-size="12" font-weight="700">avaliação</text>
<text x="800" y="697" text-anchor="middle" font-size="11">UC-07.3</text>
<ellipse class="case" cx="360" cy="780" rx="155" ry="38"/>
<text x="360" y="767" text-anchor="middle" font-size="12" font-weight="700">Agenda e</text>
<text x="360" y="782" text-anchor="middle" font-size="12" font-weight="700">consultoria</text>
<text x="360" y="802" text-anchor="middle" font-size="11">UC-08</text>
<ellipse class="case" cx="800" cy="780" rx="155" ry="38"/>
<text x="800" y="767" text-anchor="middle" font-size="12" font-weight="700">Encerrar vínculo</text>
<text x="800" y="782" text-anchor="middle" font-size="12" font-weight="700">e renovação</text>
<text x="800" y="802" text-anchor="middle" font-size="11">UC-09</text>
<ellipse class="case" cx="360" cy="885" rx="155" ry="38"/>
<text x="360" y="872" text-anchor="middle" font-size="12" font-weight="700">Consentir, exportar</text>
<text x="360" y="887" text-anchor="middle" font-size="12" font-weight="700">e encerrar conta</text>
<text x="360" y="907" text-anchor="middle" font-size="11">UC-10</text>
<ellipse class="case" cx="800" cy="885" rx="155" ry="38"/>
<text x="800" y="872" text-anchor="middle" font-size="12" font-weight="700">Configurar</text>
<text x="800" y="887" text-anchor="middle" font-size="12" font-weight="700">comissão/carência</text>
<text x="800" y="907" text-anchor="middle" font-size="11">UC-04.2</text>
<text x="170" y="995" font-size="12">Atores secundários dependem de configuração; testes HTTP não comprovam sandbox real.</text><text x="170" y="1016" font-size="11">Fonte: casos-de-uso.puml | API compartilhada entre web e aplicativo</text></svg>
