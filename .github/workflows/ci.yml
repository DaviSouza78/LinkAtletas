name: LinkAtletas checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    name: LinkAtletas - validacao completa
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: postgresql://linkatletas:linkatletas_dev@127.0.0.1:54329/linkatletas_test
      DATABASE_URL: postgresql://linkatletas:linkatletas_dev@127.0.0.1:54329/linkatletas
      S3_ENDPOINT: http://127.0.0.1:8333
      S3_ACCESS_KEY: linkatletas-local
      S3_SECRET_KEY: local-only-change-in-production
      S3_BUCKET: linkatletas-private
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      SMTP_FROM: no-reply@linkatletas.local
      APP_ORIGIN: http://localhost:5173
      BILLING_MODE: academic
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Start local database, SMTP capture and S3
        run: docker compose up -d --wait
      - name: Types and build
        run: pnpm build
      - name: Unit and integration tests
        run: pnpm test --reporter=json --outputFile=docs/evidencias/api/ci-vitest.json
      - name: Backup and restoration of isolated encrypted data
        run: node --import tsx scripts/verificacao/verify-backup.ts
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Browser flows and accessibility
        run: pnpm test:e2e
      - name: Documentation links and schemas
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" node --import tsx scripts/banco/export-schema.ts
          git diff --exit-code -- docs/evidencias/api/database-schema.json docs/diagramas/der.mmd
          node --import tsx scripts/documentacao/check-docs.ts
      - name: Native application checks and bundles
        run: |
          pnpm --dir mobile install --frozen-lockfile
          pnpm --dir mobile typecheck
          pnpm --dir mobile check
          pnpm --dir mobile test
          pnpm --dir mobile export
      - name: Local TLS deployment
        run: |
          node --import tsx scripts/operacao/init-production.ts
          # Compose prefers the shell environment over --env-file. Do not override
          # generated production settings with this job's development defaults.
          unset APP_ORIGIN S3_ENDPOINT S3_ACCESS_KEY S3_SECRET_KEY S3_BUCKET SMTP_HOST SMTP_PORT SMTP_FROM BILLING_MODE DATABASE_URL
          docker compose --env-file .env.production.local -f compose.production.yaml up -d --build --wait
          node --import tsx scripts/verificacao/verify-tls.ts
      - name: Diagnose a failed production start
        if: failure()
        run: |
          if test -f .env.production.local; then docker compose --env-file .env.production.local -f compose.production.yaml logs --tail=60 app; fi
      - name: Keep measured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            docs/evidencias
            mobile/dist
          retention-days: 14
      - name: Stop local services
        if: always()
        run: |
          docker compose down
          if test -f .env.production.local; then docker compose --env-file .env.production.local -f compose.production.yaml down; fi
